name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      DB_PROVIDER: "sqlite"
      BETTER_AUTH_SECRET: "ci-not-a-real-secret-override-in-production"
      BETTER_AUTH_URL: "http://localhost:3100"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare database (Prisma generate + SQLite push)
        run: npm run db:setup

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: House rule - no em/en dashes in src or prisma
        run: |
          if LC_ALL=C.UTF-8 grep -rlP "[\x{2014}\x{2013}]" src prisma; then
            echo "::error::Found an em-dash or en-dash in src/ or prisma/. Use a plain hyphen (-) instead."
            exit 1
          fi
          echo "OK: no em/en dashes."
